name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: flutter
            runner: ubuntu-latest
            test: flutter pub get && flutter test
            build: flutter build appbundle --release
          - framework: react-native
            runner: ubuntu-latest
            test: npm ci && npm test
            build: cd android && ./gradlew :app:bundleRelease
          - framework: android
            runner: ubuntu-latest
            test: ./gradlew test
            build: ./gradlew :app:bundleRelease
          - framework: ios
            runner: macos-14
            test: xcodebuild -project MyApp.xcodeproj -scheme MyApp -destination 'platform=iOS Simulator,name=iPhone 15' test
            build: xcodebuild -project MyApp.xcodeproj -scheme MyApp -destination 'generic/platform=iOS' archive
          - framework: maui
            runner: ubuntu-latest
            test: dotnet test
            build: dotnet publish -f net8.0-android -c Release
          - framework: kmp
            runner: ubuntu-latest
            test: ./gradlew :shared:allTests
            build: ./gradlew :composeApp:bundleRelease
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test
        run: ${{ matrix.test }}
      - name: Build
        run: ${{ matrix.build }}
