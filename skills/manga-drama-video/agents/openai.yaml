  brand_color: "#E63946"
  default_prompt: "Use $manga-drama-video with the series continuity lock: one locked face for 张三 across every episode. Auto-read any user-provided resources, auto-select engines into engine_plan.json, then make a 30s 抖音 9:16 写实动漫 episode about a tired salaryman who finds a cat in a neon alley, using the 2026 AI 漫剧 style bank: realistic skin, sharp outlines, no AI artifacts, natural motion and lip sync, auto storyboard, fight/camera breakdown, 配音, and FFmpeg/VapourSynth post-processing."

dependencies:
